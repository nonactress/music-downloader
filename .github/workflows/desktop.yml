# 쉬운 음악 만들기 — 윈도우 설치 파일 빌드 · 시험 (PLAN 결정 75)
# 프론트 빌드 → 시험 → 도구 3개(버전 고정 + SHA-256) → PyInstaller → Inno Setup
# → 무인 설치 → --selftest → 지우기. v* 태그면 GitHub Release에 설치 파일을 올린다.
# 실제 유튜브 받기는 하지 않음 (CI는 데이터센터 IP라 유튜브가 막음).
name: desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["backend/**", "worker/**", "desktop/**", "frontend/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["backend/**", "worker/**", "desktop/**", "frontend/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write   # Release 올리기

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: 버전 정하기
        id: ver
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") { $v = "${{ github.ref_name }}".Substring(1) }
          else { $v = (Select-String -Path desktop/version.py -Pattern 'APP_VERSION = "(.+?)"').Matches[0].Groups[1].Value }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "버전 $v"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 프론트 빌드
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop/requirements.txt
      - name: 파이썬 패키지
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pytest==9.1.1 httpx==0.28.1 fakeredis==2.39.0

      - name: 시험 (데스크톱 관련, 윈도우에서)
        working-directory: backend
        run: python -m pytest -q ../desktop/tests tests/test_desktop.py tests/test_desktop_save.py tests/test_ffmpeg_builder.py

      - name: 도구 받기 (버전 고정 + SHA-256 확인)
        run: python desktop/fetch_tools.py --out build/tools --cache build/downloads

      - name: WebView2 설치기 받기 (Microsoft 서명 확인)
        run: |
          New-Item -ItemType Directory -Force build/redist | Out-Null
          $f = "build/redist/MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $f
          $sig = Get-AuthenticodeSignature $f
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "O=Microsoft Corporation") {
            throw "WebView2 설치기 서명이 이상함: $($sig.Status) $($sig.SignerCertificate.Subject)"
          }

      - name: PyInstaller (한 폴더)
        run: pyinstaller desktop/easymusic.spec --noconfirm --distpath dist --workpath build/pyinstaller

      - name: Inno Setup
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" desktop\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC 실패" }

      - name: 무인 설치 → selftest
        run: |
          $setup = "build/installer/EasyMusicSetup-${{ steps.ver.outputs.version }}.exe"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "설치 실패: $($p.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\Programs\EasyMusic\EasyMusic.exe"
          if (-not (Test-Path $exe)) { throw "설치된 파일 없음: $exe" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\쉬운 음악 만들기.lnk")) { throw "시작 메뉴 바로가기 없음" }
          $out = "$env:RUNNER_TEMP\selftest.txt"
          $t = Start-Process $exe -ArgumentList "--selftest","--selftest-out",$out -Wait -PassThru
          Get-Content $out -Encoding utf8
          if ($t.ExitCode -ne 0) { throw "selftest 실패: $($t.ExitCode)" }

      - name: 지우기 확인
        run: |
          $un = "$env:LOCALAPPDATA\Programs\EasyMusic\unins000.exe"
          $p = Start-Process $un -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path "$env:LOCALAPPDATA\Programs\EasyMusic\EasyMusic.exe") { throw "지우기 후에도 남음" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EasyMusicSetup-${{ steps.ver.outputs.version }}
          path: |
            build/installer/*.exe
            ${{ runner.temp }}/selftest.txt
          if-no-files-found: warn

      - name: Release (v* 태그)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/installer/EasyMusicSetup-${{ steps.ver.outputs.version }}.exe
          generate_release_notes: true
