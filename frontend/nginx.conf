# 쉬운 음악 만들기 — web (PLAN 결정 49 · 50)
# 프론트 정적 파일 + /api/* → http://api:8000/* (접두사 /api 제거, CONTRACT 0장)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API로 가는 본문은 Edit JSON뿐 (20곡도 수 KB)
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        # 끝의 /가 /api/ 접두사를 떼어 낸다: /api/jobs/j1 → /jobs/j1
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 결정 50: backend는 web(신뢰 프록시)에서 온 요청만 맨 오른쪽 값을 믿는다 — 여기서 붙이는 값이 실제 접속 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 오디오 미리듣기(Range → 206)와 큰 mp3 다운로드: nginx가 모아 두지 않고 바로 흘려보낸다
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        # 20곡 결과 파일(최악 575MB)을 느린 회선으로 받아도 끊기지 않게
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # vite가 이름에 해시를 붙인 파일은 오래 저장
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 화면은 하나(index.html) — 새 배포가 바로 보이게 매번 확인
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
