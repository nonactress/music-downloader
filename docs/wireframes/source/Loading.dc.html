<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>불러오는 중</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 100%; min-height: 960px; background: #F7F7F5; color: #1A1A1A; font-family: 'IBM Plex Sans KR', sans-serif; display: flex; flex-direction: column;">
  <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 40px; background: #FFFFFF; border-bottom: 2px solid #E2E2DE;">
    <div style="font-size: 26px; font-weight: 700;">쉬운 음악 만들기</div>
    <nav aria-label="진행 단계" style="display: flex; flex-wrap: wrap; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; background: #1F4FB8; color: #FFFFFF; font-size: 19px; font-weight: 700;"><span style="width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; color: #1F4FB8; display: flex; align-items: center; justify-content: center; font-size: 16px;">1</span>노래 가져오기</div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; background: #ECECE8; color: #5A5A57; font-size: 19px; font-weight: 600;"><span style="width: 28px; height: 28px; border-radius: 50%; background: #D0D0CB; display: flex; align-items: center; justify-content: center; font-size: 16px;">2</span>노래 다듬기</div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; background: #ECECE8; color: #5A5A57; font-size: 19px; font-weight: 600;"><span style="width: 28px; height: 28px; border-radius: 50%; background: #D0D0CB; display: flex; align-items: center; justify-content: center; font-size: 16px;">3</span>저장하기</div>
    </nav>
    <div style="display: flex; gap: 10px;">
      <button style="height: 52px; padding: 0 18px; border: 2px solid #1A1A1A; border-radius: 12px; background: #FFFFFF; font-size: 19px; font-weight: 600;">가+ 글자 크게</button>
      <button style="height: 52px; padding: 0 18px; border: 2px solid #1A1A1A; border-radius: 12px; background: #FFFFFF; font-size: 19px; font-weight: 600;">도움말</button>
    </div>
  </header>

  <main style="width: 100%; max-width: 1040px; margin: 0 auto; box-sizing: border-box; padding: 72px 40px; display: flex; flex-direction: column; gap: 36px;">
    <h1 style="margin: 0; font-size: 44px; font-weight: 700;">노래를 가져오고 있어요</h1>

    <div style="display: flex; flex-wrap: wrap; gap: 36px; align-items: center; padding: 32px; border-radius: 20px; background: #FFFFFF; border: 2px solid #E2E2DE;">
      <div style="flex: 1 1 360px; aspect-ratio: 16 / 9; border-radius: 14px; background: #D0D0CB; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #555;">[영상 썸네일]</div>
      <div style="flex: 999 1 400px; min-width: 0; display: flex; flex-direction: column; gap: 18px;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div style="font-size: 28px; font-weight: 700;">[노래 제목]</div>
          <div style="font-size: 20px; color: #4A4A48;">[채널 이름] · 3분 45초</div>
        </div>
        <div style="height: 24px; border-radius: 12px; background: #E2E2DE; overflow: hidden;">
          <div style="width: 60%; height: 100%; border-radius: 12px; background: #1F4FB8;"></div>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 22px;">
          <span style="font-weight: 700;">60% 완료</span>
          <span style="color: #4A4A48;">약 20초 남았어요</span>
        </div>
      </div>
    </div>

    <div style="padding: 20px 24px; border-radius: 16px; background: #EAEAE6; font-size: 21px; line-height: 1.6;">이 창을 닫지 말고 잠시만 기다려 주세요. 다 되면 <b>자동으로 편집 화면</b>으로 넘어가요.</div>

    <div style="display: flex;">
      <a href="Main.dc.html" style="height: 64px; padding: 0 28px; display: flex; align-items: center; border: 2px solid #1A1A1A; border-radius: 14px; background: #FFFFFF; font-size: 20px; font-weight: 600; color: #1A1A1A; text-decoration: none;">취소하고 돌아가기</a>
    </div>
  </main>
</div>
</x-dc>
