<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>한 곡 잘라내기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 100%; min-height: 1000px; background: #F7F7F5; color: #1A1A1A; font-family: 'IBM Plex Sans KR', sans-serif; display: flex; flex-direction: column;">
  <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 40px; background: #FFFFFF; border-bottom: 2px solid #E2E2DE;">
    <div style="font-size: 26px; font-weight: 700;">쉬운 음악 만들기</div>
    <nav aria-label="진행 단계" style="display: flex; flex-wrap: wrap; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; background: #E3EAF8; color: #1F4FB8; font-size: 19px; font-weight: 600;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>노래 가져오기</div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; background: #1F4FB8; color: #FFFFFF; font-size: 19px; font-weight: 700;"><span style="width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; color: #1F4FB8; display: flex; align-items: center; justify-content: center; font-size: 16px;">2</span>노래 다듬기</div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; background: #ECECE8; color: #5A5A57; font-size: 19px; font-weight: 600;"><span style="width: 28px; height: 28px; border-radius: 50%; background: #D0D0CB; display: flex; align-items: center; justify-content: center; font-size: 16px;">3</span>저장하기</div>
    </nav>
    <div style="display: flex; gap: 10px;">
      <button style="height: 52px; padding: 0 18px; border: 2px solid #1A1A1A; border-radius: 12px; background: #FFFFFF; font-size: 19px; font-weight: 600;">가+ 글자 크게</button>
      <button style="height: 52px; padding: 0 18px; border: 2px solid #1A1A1A; border-radius: 12px; background: #FFFFFF; font-size: 19px; font-weight: 600;">도움말</button>
    </div>
  </header>

  <main style="width: 100%; max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: 28px 40px 40px; display: flex; flex-direction: column; gap: 24px; flex: 1;">
    <a href="Edit.dc.html" style="align-self: flex-start; height: 56px; padding: 0 20px; display: flex; align-items: center; gap: 10px; border: 2px solid #1A1A1A; border-radius: 12px; background: #FFFFFF; color: #1A1A1A; font-size: 20px; font-weight: 700; text-decoration: none;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>노래 목록으로</a>

    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 18px;">
      <div style="width: 56px; height: 56px; border-radius: 50%; background: #1A1A1A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; flex-shrink: 0;">1</div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <h1 style="margin: 0; font-size: 34px; font-weight: 700;">1번 노래 잘라내기</h1>
        <div style="font-size: 20px; color: #4A4A48;">[첫 번째 노래 제목] · 원래 길이 3분 45초</div>
      </div>
    </div>

    <section style="padding: 32px; border-radius: 20px; background: #FFFFFF; border: 2px solid #E2E2DE; display: flex; flex-direction: column; gap: 28px;">
      <p style="margin: 0; font-size: 22px; line-height: 1.5;">남길 부분의 <b>시작</b>과 <b>끝</b>을 정해주세요. 파란 부분만 남고 회색 부분은 잘려나가요.</p>

      <div style="position: relative; height: 160px; border-radius: 14px; background: #F0F0EC; overflow: hidden;">
        <div style="position: absolute; inset: 24px 0; background: repeating-linear-gradient(90deg, #BDBDB7 0 5px, transparent 5px 10px);"></div>
        <div style="position: absolute; top: 0; bottom: 0; left: 6%; right: 11%; background: rgba(31, 79, 184, 0.16); border-left: 6px solid #1F4FB8; border-right: 6px solid #1F4FB8;"></div>
        <div style="position: absolute; top: 56px; left: calc(6% - 18px); width: 36px; height: 48px; border-radius: 8px; background: #1F4FB8;"></div>
        <div style="position: absolute; top: 56px; right: calc(11% - 18px); width: 36px; height: 48px; border-radius: 8px; background: #1F4FB8;"></div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px;">
        <div style="padding: 20px; border-radius: 16px; background: #F7F7F5; display: flex; flex-direction: column; gap: 14px; align-items: center;">
          <div style="font-size: 22px; font-weight: 700;">시작</div>
          <div style="display: flex; align-items: center; gap: 16px;">
            <button style="width: 104px; height: 64px; border: 2px solid #1A1A1A; border-radius: 14px; background: #FFFFFF; font-size: 20px; font-weight: 700;">−5초</button>
            <div style="min-width: 120px; text-align: center; font-size: 40px; font-weight: 700;">0:12</div>
            <button style="width: 104px; height: 64px; border: 2px solid #1A1A1A; border-radius: 14px; background: #FFFFFF; font-size: 20px; font-weight: 700;">+5초</button>
          </div>
        </div>
        <div style="padding: 20px; border-radius: 16px; background: #F7F7F5; display: flex; flex-direction: column; gap: 14px; align-items: center;">
          <div style="font-size: 22px; font-weight: 700;">끝</div>
          <div style="display: flex; align-items: center; gap: 16px;">
            <button style="width: 104px; height: 64px; border: 2px solid #1A1A1A; border-radius: 14px; background: #FFFFFF; font-size: 20px; font-weight: 700;">−5초</button>
            <div style="min-width: 120px; text-align: center; font-size: 40px; font-weight: 700;">3:20</div>
            <button style="width: 104px; height: 64px; border: 2px solid #1A1A1A; border-radius: 14px; background: #FFFFFF; font-size: 20px; font-weight: 700;">+5초</button>
          </div>
        </div>
      </div>

      <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;">
        <div style="font-size: 22px;">남는 길이 <b style="font-size: 26px;">3분 8초</b> <span style="font-size: 18px; color: #4A4A48;">(바꾸는 즉시 반영돼요)</span></div>
        <button style="height: 68px; padding: 0 26px; display: flex; align-items: center; gap: 10px; border: 2px solid #1A1A1A; border-radius: 14px; background: #FFFFFF; font-size: 21px; font-weight: 700;"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg>남긴 부분 들어보기</button>
      </div>
    </section>

    <div style="margin-top: auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px;">
      <button style="height: 60px; padding: 0 16px; display: flex; align-items: center; gap: 8px; border: none; background: transparent; font-size: 20px; font-weight: 600; color: #4A4A48; text-decoration: underline;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-15-6.7L3 13"></path></svg>이 노래 자르기 취소</button>
      <a href="Edit.dc.html" style="height: 76px; padding: 0 44px; display: flex; align-items: center; gap: 12px; border-radius: 18px; background: #1F4FB8; color: #FFFFFF; font-size: 24px; font-weight: 700; text-decoration: none;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>완료, 목록으로</a>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>

  renderVals() { return {}; }
}
</script>
</body>
</html>
