<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모든 노래 빠르기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 100%; min-height: 1000px; background: #F7F7F5; color: #1A1A1A; font-family: 'IBM Plex Sans KR', sans-serif; display: flex; flex-direction: column;">
  <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 40px; background: #FFFFFF; border-bottom: 2px solid #E2E2DE;">
    <div style="font-size: 26px; font-weight: 700;">쉬운 음악 만들기</div>
    <nav aria-label="진행 단계" style="display: flex; flex-wrap: wrap; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; background: #E3EAF8; color: #1F4FB8; font-size: 19px; font-weight: 600;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>노래 가져오기</div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; background: #1F4FB8; color: #FFFFFF; font-size: 19px; font-weight: 700;"><span style="width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; color: #1F4FB8; display: flex; align-items: center; justify-content: center; font-size: 16px;">2</span>노래 다듬기</div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; background: #ECECE8; color: #5A5A57; font-size: 19px; font-weight: 600;"><span style="width: 28px; height: 28px; border-radius: 50%; background: #D0D0CB; display: flex; align-items: center; justify-content: center; font-size: 16px;">3</span>저장하기</div>
    </nav>
    <div style="display: flex; gap: 10px;">
      <button style="height: 52px; padding: 0 18px; border: 2px solid #1A1A1A; border-radius: 12px; background: #FFFFFF; font-size: 19px; font-weight: 600;">가+ 글자 크게</button>
      <button style="height: 52px; padding: 0 18px; border: 2px solid #1A1A1A; border-radius: 12px; background: #FFFFFF; font-size: 19px; font-weight: 600;">도움말</button>
    </div>
  </header>

  <main style="width: 100%; max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: 28px 40px 40px; display: flex; flex-direction: column; gap: 24px; flex: 1;">
    <a href="Edit.dc.html" style="align-self: flex-start; height: 56px; padding: 0 20px; display: flex; align-items: center; gap: 10px; border: 2px solid #1A1A1A; border-radius: 12px; background: #FFFFFF; color: #1A1A1A; font-size: 20px; font-weight: 700; text-decoration: none;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>노래 목록으로</a>

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <h1 style="margin: 0; font-size: 34px; font-weight: 700;">모든 노래 빠르기</h1>
      <div style="font-size: 20px; color: #4A4A48;">목록에 있는 노래 2곡이 모두 같은 빠르기로 바뀌어요</div>
    </div>

    <div role="note" style="display: flex; align-items: flex-start; gap: 14px; padding: 18px 22px; border-radius: 14px; background: #FFF4E5; border: 2px solid #B4530A;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#B4530A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px;"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16.5v.5"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 21px; font-weight: 700;">따로 바꾼 빠르기가 있어요</div>
        <div style="font-size: 19px; line-height: 1.5;">2번 노래는 지금 <b>빠르게(1.25배)</b>예요. 여기서 정하면 이 값 대신 새 빠르기로 바뀌어요.</div>
      </div>
    </div>

    <section style="padding: 32px; border-radius: 20px; background: #FFFFFF; border: 2px solid #E2E2DE; display: flex; flex-direction: column; gap: 26px;">
      <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 12px;">
        <legend style="padding: 0; margin-bottom: 12px; font-size: 22px; font-weight: 700;">어디에 적용할까요?</legend>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
          <a href="Speed.dc.html" style="min-height: 72px; box-sizing: border-box; padding: 10px 20px; display: flex; align-items: center; gap: 14px; border: 2px solid #1A1A1A; border-radius: 14px; background: #FFFFFF; color: #1A1A1A; text-decoration: none;"><span style="width: 24px; height: 24px; border-radius: 50%; border: 2px solid #1A1A1A; flex-shrink: 0;"></span><span style="font-size: 22px; font-weight: 700;">이 노래만</span></a>
          <label style="min-height: 72px; box-sizing: border-box; padding: 10px 20px; display: flex; align-items: center; gap: 14px; border: 4px solid #1F4FB8; border-radius: 14px; background: #E3EAF8; cursor: pointer;"><input type="radio" name="scope-all" checked style="width: 28px; height: 28px; accent-color: #1F4FB8;"><span style="font-size: 22px; font-weight: 700;">모든 노래 (2곡)</span></label>
        </div>
      </fieldset>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px;">
        <button style="height: 124px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border: 2px solid #1A1A1A; border-radius: 18px; background: #FFFFFF; color: #1A1A1A;"><span style="font-size: 28px; font-weight: 700;">느리게</span><span style="font-size: 20px; color: #4A4A48;">0.75배</span></button>
        <button aria-pressed="true" style="height: 124px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border: 4px solid #1F4FB8; border-radius: 18px; background: #E3EAF8; color: #1A1A1A;"><span style="display: flex; align-items: center; gap: 8px; font-size: 28px; font-weight: 700;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1F4FB8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>보통</span><span style="font-size: 20px; color: #4A4A48;">원래 빠르기</span></button>
        <button style="height: 124px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border: 2px solid #1A1A1A; border-radius: 18px; background: #FFFFFF; color: #1A1A1A;"><span style="font-size: 28px; font-weight: 700;">빠르게</span><span style="font-size: 20px; color: #4A4A48;">1.25배</span></button>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 24px;">
        <div style="flex: 1 1 380px; padding: 20px; border-radius: 16px; background: #F7F7F5; display: flex; flex-direction: column; gap: 14px; align-items: center;">
          <div style="font-size: 22px; font-weight: 700;">조금씩 바꾸기</div>
          <div style="display: flex; align-items: center; gap: 16px;">
            <button aria-label="조금 느리게" style="width: 80px; height: 64px; border: 2px solid #1A1A1A; border-radius: 14px; background: #FFFFFF; font-size: 30px; font-weight: 700;">−</button>
            <div style="min-width: 150px; text-align: center; font-size: 40px; font-weight: 700;">1.0배</div>
            <button aria-label="조금 빠르게" style="width: 80px; height: 64px; border: 2px solid #1A1A1A; border-radius: 14px; background: #FFFFFF; font-size: 30px; font-weight: 700;">+</button>
          </div>
        </div>
        <label style="flex: 1 1 380px; padding: 20px 24px; border-radius: 16px; background: #F7F7F5; display: flex; align-items: center; gap: 18px; cursor: pointer;">
          <input type="checkbox" checked style="width: 36px; height: 36px; flex-shrink: 0; accent-color: #1F4FB8;">
          <span style="display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 22px; font-weight: 700;">목소리 높낮이는 그대로 두기 (추천)</span><span style="font-size: 18px; color: #4A4A48;">끄면 빨라질 때 목소리가 높아져요</span></span>
        </label>
      </div>

      <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;">
        <div style="font-size: 22px;">전체 길이 <b style="font-size: 26px;">7분 8초</b></div>
        <button style="height: 68px; padding: 0 26px; display: flex; align-items: center; gap: 10px; border: 2px solid #1A1A1A; border-radius: 14px; background: #FFFFFF; font-size: 21px; font-weight: 700;"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg>전체 들어보기</button>
      </div>
    </section>

    <div style="margin-top: auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px;">
      <a href="Edit.dc.html" style="height: 60px; padding: 0 16px; display: flex; align-items: center; font-size: 20px; font-weight: 600; color: #4A4A48;">바꾸지 않고 돌아가기</a>
      <a href="Edit.dc.html" style="height: 76px; padding: 0 44px; display: flex; align-items: center; gap: 12px; border-radius: 18px; background: #1F4FB8; color: #FFFFFF; font-size: 24px; font-weight: 700; text-decoration: none;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>모든 노래에 적용하기</a>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
