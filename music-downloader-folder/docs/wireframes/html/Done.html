<!doctype html>
<html lang="ko">

<title>저장 완료</title>

<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap">
<style>

</style>

<div style="width: 100%; min-height: 960px; background: #F7F7F5; color: #1A1A1A; font-family: 'IBM Plex Sans KR', 'Noto Sans CJK KR', sans-serif; display: flex; flex-direction: column;">

    <nav aria-label="진행 단계" style="display: flex; flex-wrap: wrap; gap: 8px;">

    <div style="display: flex; gap: 10px;">
      <button style="height: 52px; padding: 0 18px; border: 2px solid #1A1A1A; border-radius: 12px; background: #FFFFFF; font-size: 19px; font-weight: 600;">가+ 글자 크게</button>
      <button style="height: 52px; padding: 0 18px; border: 2px solid #1A1A1A; border-radius: 12px; background: #FFFFFF; font-size: 19px; font-weight: 600;">도움말</button>

  <main style="width: 100%; max-width: 860px; margin: 0 auto; box-sizing: border-box; padding: 64px 40px; display: flex; flex-direction: column; align-items: center; gap: 28px;">
    <div style="width: 112px; height: 112px; border-radius: 50%; background: #E3EAF8; display: flex; align-items: center; justify-content: center;">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#1F4FB8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="완료"><path d="M5 12l5 5L20 7"></path></svg>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <h1 style="margin: 0; font-size: 44px; font-weight: 700;">노래가 완성됐어요!</h1>

    <div style="width: 100%; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 20px; padding: 24px; border-radius: 18px; background: #FFFFFF; border: 2px solid #E2E2DE;">
      <div style="width: 64px; height: 64px; border-radius: 14px; background: #ECECE8; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">

        <div style="font-size: 19px; color: #4A4A48;">노래 2곡 · 6분 20초 · [파일 크기]</div>
      </div>
      <button style="height: 60px; padding: 0 22px; display: flex; align-items: center; gap: 8px; border: 2px solid #1A1A1A; border-radius: 14px; background: #FFFFFF; font-size: 20px; font-weight: 700;"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg>들어보기</button>

    <button style="width: 100%; height: 92px; display: flex; align-items: center; justify-content: center; gap: 14px; border: none; border-radius: 20px; background: #1F4FB8; color: #FFFFFF; font-size: 28px; font-weight: 700;">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M6 11l6 6 6-6M4 21h16"></path></svg>

    <div style="width: 100%; display: flex; flex-wrap: wrap; gap: 12px;">
      <a href="Edit.html" style="flex: 1 1 240px; height: 68px; display: flex; align-items: center; justify-content: center; border: 2px solid #1A1A1A; border-radius: 16px; background: #FFFFFF; color: #1A1A1A; font-size: 21px; font-weight: 700; text-decoration: none;">다시 고치러 가기</a>
      <a href="Main.html" style="flex: 1 1 240px; height: 68px; display: flex; align-items: center; justify-content: center; border: 2px solid #1A1A1A; border-radius: 16px; background: #FFFFFF; color: #1A1A1A; font-size: 21px; font-weight: 700; text-decoration: none;">새 노래 만들기</a>

</div>
